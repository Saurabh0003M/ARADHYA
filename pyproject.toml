[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aradhya"
version = "0.1.0"
description = "AI Assistant Project"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
aradhya = "src.aradhya.main:main"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov=core --cov-report=html"
asyncio_mode = "strict"
markers = [
    "asyncio: mark a test as asyncio-driven (handled by pytest-asyncio)",
]
